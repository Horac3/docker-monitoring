# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Resource Monitor — unified compose
#  nginx-proxy + acme-companion are running on the shared "proxy" network.
#
#  Dashboard:  https://monitoring.never9to5ive.com
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

  # ── Monitor daemon ────────────────────────────────────────────────────────
  docker-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-memory-monitor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monitor-logs:/var/log/docker-monitor
      # services.yml is reloaded every poll — edit without restarting
      - ./services.yml:/etc/monitor/services.yml:ro
    environment:
      # ── Polling & thresholds ─────────────────────────────────────────
      POLL_INTERVAL:    "30"
      ALERT_THRESHOLD:  "80"
      SPIKE_DELTA:      "20"
      COOLDOWN_SECONDS: "300"

      # ── Email ────────────────────────────────────────────────────────
      SMTP_HOST:  "smtp.gmail.com"
      SMTP_PORT:  "587"
      SMTP_USER:  "${SMTP_USER}"
      SMTP_PASS:  "${SMTP_PASS}"
      ALERT_TO:   "${ALERT_TO}"
      ALERT_FROM: "${SMTP_USER}"

      # ── Service checks config path ────────────────────────────────────
      SERVICES_FILE: "/etc/monitor/services.yml"

      # ── Logging ──────────────────────────────────────────────────────
      LOG_LEVEL: "INFO"

    # The monitor needs internet access to:
    #   1. Reach smtp.gmail.com:587 for email alerts
    #   2. Reach external URLs defined in services.yml HTTP checks
    # Joining the proxy network gives it host-network-level egress via
    # the same bridge nginx-proxy uses — same pattern as BillFlow.
    networks:
      - nginx-proxy
      - internal
    mem_limit: 192m   # bumped slightly for service check threads

  # ── Dashboard UI ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: docker-monitor-dashboard
    restart: unless-stopped
    volumes:
      - monitor-logs:/var/log/docker-monitor:ro
    environment:
      DASHBOARD_PORT: "8080"
      LOG_DIR:        "/var/log/docker-monitor"
      VIRTUAL_HOST:      "monitoring.never9to5ive.com"
      VIRTUAL_PORT:      "8080"
      LETSENCRYPT_HOST:  "monitoring.never9to5ive.com"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    depends_on:
      - docker-monitor
    networks:
      - nginx-proxy
      - internal
    mem_limit: 64m

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  nginx-proxy:
    external: true
  internal:
    name: monitor-internal

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  monitor-logs: