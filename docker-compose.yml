version: "3.9"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Resource Monitor — unified compose
#  nginx-proxy + acme-companion are running on the shared "proxy" network.
#
#  Dashboard:  https://monitoring.never9to5ive.com
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

  # ── Monitor daemon ────────────────────────────────────────────────────────
  docker-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-memory-monitor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - monitor-logs:/var/log/docker-monitor
      - ./services.yml:/etc/monitor/services.yml:ro
    environment:
      # ── Polling & thresholds ─────────────────────────────────────────
      POLL_INTERVAL:    "30"
      ALERT_THRESHOLD:  "80"
      SPIKE_DELTA:      "20"
      COOLDOWN_SECONDS: "300"
      # Top N processes by CPU to include in the snapshot
      PROCESS_LIMIT:    "60"

      # ── Email ────────────────────────────────────────────────────────
      SMTP_HOST:  "smtp.gmail.com"
      SMTP_PORT:  "587"
      SMTP_USER:  "${SMTP_USER}"
      SMTP_PASS:  "${SMTP_PASS}"
      ALERT_TO:   "${ALERT_TO}"
      ALERT_FROM: "${SMTP_USER}"

      # ── Email rate limits ─────────────────────────────────────────────
      # Gmail free: 500/day. Workspace: 2000/day.
      # Defaults leave a safe buffer below the free tier limit.
      EMAIL_DAILY_LIMIT:  "${EMAIL_DAILY_LIMIT:-480}"
      EMAIL_HOURLY_LIMIT: "${EMAIL_HOURLY_LIMIT:-40}"
      EMAIL_QUOTA_WARN:   "${EMAIL_QUOTA_WARN:-0.80}"

      # ── Service checks ────────────────────────────────────────────────
      SERVICES_FILE: "/etc/monitor/services.yml"

      # ── Logging ──────────────────────────────────────────────────────
      LOG_LEVEL: "INFO"
    networks:
      - proxy
      - internal
    mem_limit: 192m

  # ── Dashboard UI ──────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: docker-monitor-dashboard
    restart: unless-stopped
    volumes:
      - monitor-logs:/var/log/docker-monitor:ro
      # Docker socket needed to proxy container stop commands from the UI
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DASHBOARD_PORT: "8080"
      LOG_DIR:        "/var/log/docker-monitor"

      # ── Authentication ────────────────────────────────────────────────
      DASHBOARD_USERNAME: "${DASHBOARD_USERNAME}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD}"
      # SECRET_KEY signs session tokens. Generate once with:
      #   python3 -c "import secrets; print(secrets.token_hex(32))"
      # Changing this value invalidates all existing sessions.
      SECRET_KEY: "${SECRET_KEY}"

      # ── nginx-proxy / SSL ────────────────────────────────────────────
      VIRTUAL_HOST:      "monitoring.never9to5ive.com"
      VIRTUAL_PORT:      "8080"
      LETSENCRYPT_HOST:  "monitoring.never9to5ive.com"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    depends_on:
      - docker-monitor
    networks:
      - proxy
      - internal
    mem_limit: 64m

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  proxy:
    external: true
  internal:
    name: monitor-internal

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  monitor-logs: